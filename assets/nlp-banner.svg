<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="80%" stop-color="#1e1035" />
      <stop offset="100%" stop-color="#0a0518" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accent-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.15) translate(25px, -15px); opacity: 0.65; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1.1) translate(0px, 0px); opacity: 0.3; }
      50% { transform: scale(0.9) translate(-20px, 20px); opacity: 0.55; }
    }
    @keyframes tokenFlow1 {
      0% { transform: translateX(0px); opacity: 0.15; }
      50% { opacity: 0.8; }
      100% { transform: translateX(450px); opacity: 0.15; }
    }
    @keyframes tokenFlow2 {
      0% { transform: translateX(0px); opacity: 0.2; }
      50% { opacity: 0.9; }
      100% { transform: translateX(-400px); opacity: 0.2; }
    }
    @keyframes wavePath {
      0% { d: path('M0,290 Q300,260 600,290 T1200,290 L1200,360 L0,360 Z'); }
      50% { d: path('M0,280 Q300,310 600,280 T1200,280 L1200,360 L0,360 Z'); }
      100% { d: path('M0,290 Q300,260 600,290 T1200,290 L1200,360 L0,360 Z'); }
    }
    @keyframes badgeFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    .orb1 { animation: pulseOrb 10s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb2 { animation: pulseOrb2 12s ease-in-out infinite; transform-origin: 1000px 260px; }
    .stream1 { animation: tokenFlow1 8s linear infinite; }
    .stream2 { animation: tokenFlow2 10s linear infinite; }
    .wave { animation: wavePath 9s ease-in-out infinite; }
    .float-badge { animation: badgeFloat 4s ease-in-out infinite; }
    .float-badge-delay { animation: badgeFloat 4s ease-in-out infinite; animation-delay: 2s; }
  </style>

  <!-- Deep Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />

  <!-- Animated Glowing Neural Ambient Orbs -->
  <circle class="orb1" cx="220" cy="90" r="160" fill="#06b6d4" opacity="0.2" filter="url(#glow)" />
  <circle class="orb2" cx="1020" cy="240" r="180" fill="#8b5cf6" opacity="0.25" filter="url(#glow)" />
  <circle class="orb1" cx="600" cy="340" r="120" fill="#ec4899" opacity="0.15" filter="url(#glow)" />

  <!-- Subtle Linguistic Neural Network Grid -->
  <g stroke="#334155" stroke-width="1" opacity="0.22">
    <line x1="80" y1="50" x2="320" y2="160" />
    <line x1="320" y1="160" x2="220" y2="290" />
    <line x1="880" y1="60" x2="1000" y2="150" />
    <line x1="1000" y1="150" x2="1120" y2="280" />
    <line x1="1000" y1="150" x2="860" y2="270" />
  </g>

  <!-- Dynamic Token Streams in Background (behind text) -->
  <g class="stream1" opacity="0.4">
    <circle cx="150" cy="60" r="4" fill="#38bdf8" filter="url(#soft-glow)" />
    <circle cx="240" cy="60" r="2.5" fill="#818cf8" />
    <circle cx="350" cy="60" r="3.5" fill="#c084fc" />
  </g>
  <g class="stream2" opacity="0.4">
    <circle cx="1050" cy="310" r="3.5" fill="#38bdf8" />
    <circle cx="920" cy="310" r="4.5" fill="#ec4899" filter="url(#soft-glow)" />
    <circle cx="800" cy="310" r="3" fill="#818cf8" />
  </g>

  <!-- Flowing Wave at Bottom -->
  <path class="wave" fill="#1e1b4b" opacity="0.35" d="M0,290 Q300,260 600,290 T1200,290 L1200,360 L0,360 Z" />

  <!-- Decorative Pills / Tags in Background Sides -->
  <g class="float-badge" transform="translate(80, 260)">
    <rect width="150" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.85" />
    <text x="75" y="21" fill="#7dd3fc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">✨ NER &amp; Parsing</text>
  </g>
  <g class="float-badge-delay" transform="translate(970, 60)">
    <rect width="150" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" opacity="0.85" />
    <text x="75" y="21" fill="#e9d5ff" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ Subword BPE</text>
  </g>

  <!-- Foreground Content: Header, Title, Subtitle, Highlights -->
  <!-- Top Category Eyebrow -->
  <g transform="translate(600, 75)">
    <rect x="-160" y="-18" width="320" height="32" rx="16" fill="#1e1e38" stroke="#6366f1" stroke-width="1.5" />
    <text x="0" y="4" fill="#a5b4fc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="2" text-anchor="middle">🌐 CURATED NLP &amp; LINGUISTICS</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="150" fill="url(#text-grad)" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" text-anchor="middle" letter-spacing="-0.5" filter="url(#soft-glow)">
    Natural Language Processing &amp; Language Tools
  </text>

  <!-- Foreground Subtitle -->
  <text x="600" y="195" fill="#94a3b8" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="17" font-weight="400" text-anchor="middle">
    SaaS Platforms • Open-Source Pipelines • Tokenizers • Embeddings • Linguistic Engines
  </text>

  <!-- Pill Row in Foreground -->
  <g transform="translate(600, 240)">
    <!-- Pill 1 -->
    <g transform="translate(-320, 0)">
      <rect x="0" y="0" width="140" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="70" y="21" fill="#38bdf8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🔤 Tokenizers</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-160, 0)">
      <rect x="0" y="0" width="140" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="70" y="21" fill="#a78bfa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🏷️ Zero-Shot NER</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="155" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="77" y="21" fill="#f472b6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🧠 Text Embeddings</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(175, 0)">
      <rect x="0" y="0" width="155" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="77" y="21" fill="#34d399" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🌍 Multilingual NLU</text>
    </g>
  </g>
</svg>
